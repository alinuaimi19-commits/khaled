<title>Quickfire</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10131c;--panel:#1b2030;--panel2:#242b40;--cream:#f2ede3;--dim:#8e97b0;
  --red:#ff4d5e;--mint:#4fe0b0;--amber:#ffb347;--violet:#9b8cff;
  --display:'Bungee','Impact',sans-serif;
  --body:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;margin:0}
body{
  position:fixed;inset:0;background:var(--ink);color:var(--cream);font-family:var(--body);
  display:flex;flex-direction:column;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
header{
  padding:max(10px,env(safe-area-inset-top)) 14px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;
}
.logo{font-family:var(--display);font-size:20px;letter-spacing:.02em}
.logo em{font-style:normal;color:var(--red)}
.hud{display:flex;gap:8px}
.pill{background:var(--panel);border-radius:10px;padding:5px 10px;text-align:center;min-width:52px}
.pill b{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);font-weight:700;letter-spacing:.1em}
.pill span{font-family:var(--mono);font-size:16px;font-weight:700;line-height:1.2}
.bar{height:12px;margin:0 14px;border-radius:6px;background:var(--panel2);overflow:hidden;flex-shrink:0}
.bar i{display:block;height:100%;width:100%;background:var(--mint);border-radius:6px}
#stage{
  flex:1;margin:12px 14px max(14px,env(safe-area-inset-bottom));
  position:relative;background:var(--panel);border-radius:20px;overflow:hidden;
  touch-action:none;min-height:0;
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mid{position:absolute;left:0;right:0;padding:0 22px;text-align:center;transform:translateY(-50%)}
.big{font-size:clamp(26px,8.5vw,44px);font-weight:500;line-height:1.2}
.huge{font-family:var(--display);font-size:clamp(34px,13vw,64px);line-height:1}
.sml{font-size:clamp(14px,4vw,17px);color:var(--dim);line-height:1.5}
.row{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px}
.row button{
  flex:1;min-height:68px;font-size:22px;font-family:var(--body);font-weight:500;
  border-radius:14px;border:1px solid var(--panel2);background:#20263a;color:var(--cream);cursor:pointer;
}
.row button:active{background:var(--panel2);transform:scale(.97)}
.cta{
  position:absolute;left:50%;transform:translateX(-50%);
  min-width:200px;min-height:66px;padding:0 26px;border:none;border-radius:16px;
  background:var(--red);color:var(--ink);font-family:var(--display);font-size:19px;cursor:pointer;
}
.cta:active{transform:translateX(-50%) scale(.97)}
.grid{position:absolute;inset:14px;display:grid;gap:12px}
.grid div{border-radius:16px}
.meter{position:absolute;left:26px;right:26px;height:26px;border-radius:13px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--amber);border-radius:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo">Quick<em>fire</em></div>
  <div class="hud">
    <div class="pill"><b>CLEAR</b><span id="hz">0</span></div>
    <div class="pill"><b>LIVES</b><span id="hl">3</span></div>
    <div class="pill"><b>BEST</b><span id="hb">0</span></div>
    <div class="pill"><b>RANK</b><span id="hr" style="font-size:11px">ROOKIE</span></div>
  </div>
</header>

<div class="bar"><i id="hbar"></i></div>
<div id="stage"></div>

<script>
var ST=document.getElementById('stage'),BAR=document.getElementById('hbar');
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
var HZ=document.getElementById('hz'),HL=document.getElementById('hl'),HB=document.getElementById('hb'),HR=document.getElementById('hr');
var RED='#ff4d5e',MINT='#4fe0b0',AMBER='#ffb347',VIOLET='#9b8cff',DIM='#8e97b0',CREAM='#f2ede3';
var RANKS=['ROOKIE','SHARP','QUICK','WIRED','UNTOUCHABLE'];
var score=0,lives=3,best=0,limit=4200,W=300,H=300;
var timers=[],raf=null,ears=[];

try{best=Number(localStorage.getItem('qf.best')||0);}catch(e){}
HB.textContent=best;

function rank(n){return RANKS[Math.min(4,(n/5)|0)];}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function on(el,ev,fn,op){el.addEventListener(ev,fn,op||{passive:false});ears.push([el,ev,fn]);}
function wait(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t;}
function loop(fn){(function tick(){fn();raf=requestAnimationFrame(tick);})();}
function clear(){
  timers.forEach(clearTimeout);timers=[];
  if(raf)cancelAnimationFrame(raf);raf=null;
  ears.forEach(function(e){e[0].removeEventListener(e[1],e[2]);});ears=[];
  ST.innerHTML='';
}
function size(){var r=ST.getBoundingClientRect();W=r.width;H=r.height;}
function txt(s,cls,topPct){
  var d=document.createElement('div');d.className='mid '+cls;
  d.style.top=topPct+'%';d.textContent=s;ST.appendChild(d);return d;
}
function cta(label,topPct,fn){
  var b=document.createElement('button');b.className='cta';b.textContent=label;
  b.style.top=topPct+'%';b.onclick=fn;ST.appendChild(b);return b;
}
function cvs(){
  size();
  var c=document.createElement('canvas'),dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=W*dpr;c.height=H*dpr;ST.appendChild(c);
  var x=c.getContext('2d');x.scale(dpr,dpr);return x;
}
function pos(e){var r=ST.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function swipe(fn){
  var sx=0,sy=0,t0=0;
  on(ST,'pointerdown',function(e){e.preventDefault();sx=e.clientX;sy=e.clientY;t0=Date.now();});
  on(ST,'pointerup',function(e){
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)<34&&Math.abs(dy)<34)return;
    fn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  });
}
function shade(c){
  var m={'#4fe0b0':'#8fefd2','#9b8cff':'#c3bbff','#ffb347':'#ffd39a','#ff4d5e':'#ff9aa4'};
  return m[c]||'#b4b2a9';
}

var MICRO=[
{prompt:'Tap the odd colour',timeoutWin:false,
 go:function(hard,done){
  var n=hard>0.55?16:9,per=n===9?3:4;
  var cols=[MINT,VIOLET,AMBER,RED];
  var base=cols[(Math.random()*cols.length)|0];
  var alt=hard>0.65?shade(base):cols.filter(function(c){return c!==base;})[(Math.random()*3)|0];
  var odd=(Math.random()*n)|0;
  var g=document.createElement('div');g.className='grid';
  g.style.gridTemplateColumns='repeat('+per+',1fr)';
  for(var i=0;i<n;i++){
   var d=document.createElement('div');d.dataset.i=i;
   d.style.background=i===odd?alt:base;
   g.appendChild(d);
  }
  ST.appendChild(g);
  on(g,'pointerdown',function(e){
   e.preventDefault();
   if(e.target.dataset.i!==undefined)done(+e.target.dataset.i===odd);
  });
 }},

{prompt:'Swipe the arrow',timeoutWin:false,
 go:function(hard,done){
  var dirs=['up','down','left','right'],ic={up:'↑',down:'↓',left:'←',right:'→'};
  var want=dirs[(Math.random()*4)|0];
  var a=txt(ic[want],'huge',40);a.style.fontSize='clamp(70px,26vw,130px)';a.style.color=VIOLET;
  txt('swipe that way',' sml',72);
  swipe(function(d){done(d===want);});
  on(window,'keydown',function(e){
   var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
   if(m){e.preventDefault();done(m===want);}
  });
 }},

{prompt:'Do not get hit',timeoutWin:true,
 go:function(hard,done){
  var x=cvs(),p={x:W/2,y:H*0.78},hz=[];
  var n=1+Math.round(hard*2),R=Math.max(16,Math.min(W,H)*0.075);
  for(var i=0;i<n;i++)hz.push({
   x:R+Math.random()*(W-2*R),y:R+Math.random()*(H*0.45),
   vx:(Math.random()>.5?1:-1)*(1.9+hard*2.5),vy:(Math.random()>.5?1:-1)*(1.5+hard*2.1),r:R});
  function grab(e){e.preventDefault();var q=pos(e);p.x=q.x;p.y=q.y;}
  on(ST,'pointerdown',grab);on(ST,'pointermove',grab);
  loop(function(){
   x.clearRect(0,0,W,H);
   x.fillStyle=DIM;x.font='400 14px sans-serif';
   x.fillText('drag the teal dot',16,26);
   for(var i=0;i<hz.length;i++){var h=hz[i];
    h.x+=h.vx;h.y+=h.vy;
    if(h.x<h.r||h.x>W-h.r)h.vx*=-1;
    if(h.y<h.r||h.y>H-h.r)h.vy*=-1;
    x.fillStyle=RED;x.beginPath();x.roundRect(h.x-h.r,h.y-h.r,h.r*2,h.r*2,6);x.fill();
    if(Math.hypot(h.x-p.x,h.y-p.y)<h.r+15){done(false);return;}}
   x.fillStyle=MINT;x.beginPath();x.arc(p.x,p.y,16,0,6.3);x.fill();
  });
 }},

{prompt:'Tap it before it lands',timeoutWin:false,
 go:function(hard,done){
  var x=cvs();
  var R=Math.max(20,Math.min(W,H)*(0.11-hard*0.035));
  var o={x:R+Math.random()*(W-2*R),y:-R,v:(H/150)*(1.5+hard*1.6),r:R};
  on(ST,'pointerdown',function(e){e.preventDefault();var q=pos(e);
   done(Math.hypot(q.x-o.x,q.y-o.y)<o.r+26);});
  loop(function(){
   o.y+=o.v;
   x.clearRect(0,0,W,H);
   x.strokeStyle='rgba(142,151,176,.45)';x.lineWidth=3;
   x.beginPath();x.moveTo(0,H-16);x.lineTo(W,H-16);x.stroke();
   x.fillStyle=AMBER;x.beginPath();x.arc(o.x,o.y,o.r,0,6.3);x.fill();
   if(o.y>H-16+o.r)done(false);
  });
 }},

{prompt:'How many dots?',timeoutWin:false,
 go:function(hard,done){
  var n=3+((Math.random()*(hard>0.5?7:5))|0);
  var x=cvs(),pts=[],R=Math.max(14,Math.min(W,H)*0.062);
  for(var i=0;i<n;i++){
   var tr=0,p;
   do{p={x:R+8+Math.random()*(W-2*R-16),y:R+8+Math.random()*(H*0.62-2*R)};tr++;}
   while(tr<60&&pts.some(function(q){return Math.hypot(q.x-p.x,q.y-p.y)<R*2.6;}));
   pts.push(p);}
  x.fillStyle=VIOLET;
  pts.forEach(function(p){x.beginPath();x.arc(p.x,p.y,R,0,6.3);x.fill();});
  var opts=[n];
  while(opts.length<4){var v=Math.max(1,n+((Math.random()*5)|0)-2);if(opts.indexOf(v)<0)opts.push(v);}
  opts.sort(function(a,b){return a-b;});
  var row=document.createElement('div');row.className='row';
  opts.forEach(function(v){
   var b=document.createElement('button');b.textContent=v;b.dataset.v=v;row.appendChild(b);});
  ST.appendChild(row);
  on(row,'pointerdown',function(e){
   e.preventDefault();var b=e.target.closest('button');if(b)done(+b.dataset.v===n);});
 }},

{prompt:'Tap fast to fill it',timeoutWin:false,
 go:function(hard,done){
  var need=8+Math.round(hard*11),got=0;
  var lab=txt('0 / '+need,'huge',40);lab.style.color=MINT;
  var m=document.createElement('div');m.className='meter';m.style.top='62%';
  var f=document.createElement('i');m.appendChild(f);ST.appendChild(m);
  on(ST,'pointerdown',function(e){
   e.preventDefault();got++;buzz(8);
   lab.textContent=got+' / '+need;
   f.style.width=Math.min(100,(got/need)*100)+'%';
   if(got>=need)done(true);});
 }},

{prompt:'Touch nothing',timeoutWin:true,
 go:function(hard,done){
  var a=txt('hands off','huge',42);a.style.color=RED;
  txt('do not tap the screen',' sml',66);
  on(ST,'pointerdown',function(e){e.preventDefault();done(false);});
  on(window,'keydown',function(e){e.preventDefault();done(false);});
 }},

{prompt:'Tap inside the band',timeoutWin:false,
 go:function(hard,done){
  var x=cvs(),M=Math.min(W,H),cx=W/2,cy=H/2;
  var r=M*0.03,grow=M*(0.006+hard*0.006);
  var lo=M*(0.30-hard*0.09),hi=lo+M*(0.11-hard*0.045),fired=false;
  on(ST,'pointerdown',function(e){e.preventDefault();
   if(fired)return;fired=true;done(r>=lo&&r<=hi);});
  loop(function(){
   r+=grow;
   x.clearRect(0,0,W,H);
   x.globalAlpha=.32;x.strokeStyle=MINT;x.lineWidth=hi-lo;
   x.beginPath();x.arc(cx,cy,(lo+hi)/2,0,6.3);x.stroke();x.globalAlpha=1;
   x.strokeStyle=(r>=lo&&r<=hi)?MINT:VIOLET;x.lineWidth=6;
   x.beginPath();x.arc(cx,cy,r,0,6.3);x.stroke();
   if(r>M*0.48)done(false);
  });
 }}
];

var last=-1;
function round(){
  clear();size();
  var i;do{i=(Math.random()*MICRO.length)|0;}while(i===last);
  last=i;
  var m=MICRO[i],hard=Math.min(1,score/16);
  limit=Math.max(2100,4200-score*130);
  BAR.style.width='100%';BAR.style.background=DIM;
  txt(m.prompt,'big',44);
  txt('round '+(score+1),' sml',60);
  wait(function(){
   clear();size();
   var settled=false,t0=performance.now();
   function done(ok){if(settled)return;settled=true;clear();result(ok);}
   m.go(hard,done);
   (function tick(){
    var p=1-(performance.now()-t0)/limit;
    BAR.style.width=Math.max(0,p*100)+'%';
    BAR.style.background=p<0.3?RED:p<0.6?AMBER:MINT;
    if(p>0&&!settled)requestAnimationFrame(tick);
   })();
   wait(function(){done(!!m.timeoutWin);},limit);
  },950);
}

function result(ok){
  BAR.style.width='0%';
  if(ok){
   score++;HZ.textContent=score;HR.textContent=rank(score);
   if(score>best){best=score;HB.textContent=best;try{localStorage.setItem('qf.best',best);}catch(e){}}
   buzz(22);
   var a=txt('cleared','huge',44);a.style.color=MINT;
   if(score%5===0){var b=txt('rank up — '+rank(score),' sml',62);b.style.color=AMBER;}
  }else{
   lives--;HL.textContent=lives>0?lives:0;buzz([40,60,40]);
   var c=txt('missed','huge',44);c.style.color=RED;
   if(lives>0)txt(lives===1?'one life left':lives+' lives left',' sml',62);
  }
  wait(function(){if(lives<=0)over();else round();},820);
}

function over(){
  clear();
  txt('Quickfire','huge',24);
  var s=txt(score+' cleared','big',44);s.style.color=MINT;
  txt(rank(score)+' — best run '+best,' sml',58);
  cta('Run it again',76,start);
}

function start(){
  clear();score=0;lives=3;
  HZ.textContent='0';HL.textContent='3';HR.textContent='ROOKIE';
  round();
}

function title(){
  clear();
  txt('Quickfire','huge',26);
  txt('Eight micro-games in random order. One instruction, one shot, three lives.',' sml',48);
  cta('Start the run',74,start);
}

window.addEventListener('resize',size);
window.addEventListener('orientationchange',function(){setTimeout(size,300);});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});
size();title();
</script>
</body>
</html>
