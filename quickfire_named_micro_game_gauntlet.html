<div style="padding:1rem 0;">
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Quickfire, a gauntlet of eight micro-games with a shrinking timer, three lives, and score ranks.</h2>

<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
  <div style="font-size:26px;font-weight:500;letter-spacing:-0.01em;">Quickfire</div>
  <div style="font-size:14px;color:var(--text-secondary);">eight micro-games, one shot each</div>
</div>

<div style="display:flex;gap:10px;margin-bottom:12px;max-width:420px;flex-wrap:wrap;">
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:8px 13px;flex:1;min-width:80px;">
    <div style="font-size:13px;color:var(--text-secondary)">Cleared</div>
    <div id="qz" style="font-size:21px;font-weight:500">0</div>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:8px 13px;flex:1;min-width:80px;">
    <div style="font-size:13px;color:var(--text-secondary)">Lives</div>
    <div id="ql" style="font-size:21px;font-weight:500">♥♥♥</div>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:8px 13px;flex:1;min-width:80px;">
    <div style="font-size:13px;color:var(--text-secondary)">Pace</div>
    <div id="qv" style="font-size:21px;font-weight:500">4.2s</div>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);padding:8px 13px;flex:1;min-width:80px;">
    <div style="font-size:13px;color:var(--text-secondary)">Rank</div>
    <div id="qr" style="font-size:17px;font-weight:500;padding-top:3px">Rookie</div>
  </div>
</div>

<div style="width:420px;max-width:100%;">
  <div style="height:8px;border-radius:4px;background:rgba(136,135,128,0.25);overflow:hidden;margin-bottom:8px;">
    <div id="qbar" style="height:100%;width:100%;background:#1D9E75;"></div>
  </div>
  <div id="qstage" style="position:relative;height:300px;background:var(--surface-1);border-radius:12px;overflow:hidden;touch-action:none;user-select:none;"></div>
</div>

<div style="margin-top:10px;font-size:14px;color:var(--text-secondary);max-width:420px;">Ranks climb every five rounds: Rookie, Sharp, Quick, Wired, Untouchable.</div>
</div>

<script>
(function(){
var ST=document.getElementById('qstage'),BAR=document.getElementById('qbar');
var QZ=document.getElementById('qz'),QL=document.getElementById('ql'),QV=document.getElementById('qv'),QR=document.getElementById('qr');
var TEAL='#1D9E75',CORAL='#D85A30',AMBER='#EF9F27',PURPLE='#7F77DD',BLUE='#378ADD',GRAY='#888780',PINK='#D4537E';
var score=0,lives=3,best=0,limit=4200;
var timers=[],raf=null,listeners=[];
var RANKS=['Rookie','Sharp','Quick','Wired','Untouchable'];

function rank(n){return RANKS[Math.min(4,(n/5)|0)];}
function on(el,ev,fn){el.addEventListener(ev,fn);listeners.push([el,ev,fn]);}
function wait(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t;}
function loop(fn){(function tick(){fn();raf=requestAnimationFrame(tick);})();}
function clear(){
  timers.forEach(clearTimeout);timers=[];
  if(raf)cancelAnimationFrame(raf);raf=null;
  listeners.forEach(function(l){l[0].removeEventListener(l[1],l[2]);});listeners=[];
  ST.innerHTML='';
}
function txt(s,size,col,top){
  var d=document.createElement('div');
  d.style.cssText='position:absolute;left:0;right:0;top:'+(top||'50%')+';transform:translateY(-50%);text-align:center;font-size:'+size+'px;font-weight:500;color:'+(col||'var(--text-primary)')+';padding:0 20px;line-height:1.3';
  d.textContent=s;ST.appendChild(d);return d;
}
function btn(label,top,fn){
  var b=document.createElement('button');b.textContent=label;
  b.style.cssText='position:absolute;left:50%;top:'+top+';transform:translateX(-50%);padding:11px 20px;border-radius:8px;border:1px solid var(--border-strong);background:transparent;color:var(--text-primary);font-size:15px;cursor:pointer';
  b.onclick=fn;ST.appendChild(b);return b;
}
function cvs(){
  var c=document.createElement('canvas');c.width=420;c.height=300;
  c.style.cssText='position:absolute;inset:0;width:100%;height:100%';
  ST.appendChild(c);return c;
}
function relpos(e){var r=ST.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(420/r.width),y:(e.clientY-r.top)*(300/r.height)};}
function shade(c){
  var m={'#1D9E75':'#5DCAA5','#7F77DD':'#AFA9EC','#EF9F27':'#FAC775','#378ADD':'#85B7EB','#D4537E':'#ED93B1'};
  return m[c]||'#B4B2A9';
}

var MICRO=[
{name:'odd',prompt:'Tap the odd colour',timeoutWin:false,
 go:function(hard,done){
  var n=hard>0.5?16:9,cols=[TEAL,PURPLE,AMBER,BLUE,PINK];
  var base=cols[(Math.random()*cols.length)|0];
  var alt=hard>0.6?shade(base):cols.filter(function(c){return c!==base;})[(Math.random()*4)|0];
  var odd=(Math.random()*n)|0,per=n===9?3:4;
  var g=document.createElement('div');
  g.style.cssText='position:absolute;inset:24px;display:grid;grid-template-columns:repeat('+per+',1fr);gap:10px';
  for(var i=0;i<n;i++){
   var d=document.createElement('div');d.dataset.i=i;
   d.style.cssText='border-radius:10px;background:'+(i===odd?alt:base)+';cursor:pointer';
   g.appendChild(d);
  }
  ST.appendChild(g);
  on(g,'pointerdown',function(e){if(e.target.dataset.i!==undefined)done(+e.target.dataset.i===odd);});
 }},
{name:'swipe',prompt:'Match the arrow',timeoutWin:false,
 go:function(hard,done){
  var dirs=['up','down','left','right'],ic={up:'↑',down:'↓',left:'←',right:'→'};
  var want=dirs[(Math.random()*4)|0];
  txt(ic[want],110,PURPLE,'38%');
  txt('press or tap the matching arrow',14,'var(--text-secondary)','74%');
  var row=document.createElement('div');
  row.style.cssText='position:absolute;bottom:16px;left:0;right:0;display:flex;gap:8px;justify-content:center';
  dirs.forEach(function(d){
   var b=document.createElement('button');b.textContent=ic[d];b.dataset.d=d;
   b.style.cssText='width:52px;height:40px;font-size:18px;border-radius:8px;border:1px solid var(--border-strong);background:transparent;color:var(--text-primary);cursor:pointer';
   row.appendChild(b);
  });
  ST.appendChild(row);
  on(row,'pointerdown',function(e){var b=e.target.closest('button');if(b)done(b.dataset.d===want);});
  on(window,'keydown',function(e){
   var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
   if(m){e.preventDefault();done(m===want);}});
 }},
{name:'dodge',prompt:'Do not get hit',timeoutWin:true,
 go:function(hard,done){
  var c=cvs(),x=c.getContext('2d'),p={x:210,y:250},hz=[];
  var n=1+Math.round(hard*2);
  for(var i=0;i<n;i++)hz.push({x:60+Math.random()*300,y:40+Math.random()*90,vx:(Math.random()>.5?1:-1)*(2+hard*2.6),vy:(Math.random()>.5?1:-1)*(1.6+hard*2.2),r:16});
  on(ST,'pointermove',function(e){e.preventDefault();var q=relpos(e);p.x=q.x;p.y=q.y;});
  on(ST,'pointerdown',function(e){e.preventDefault();var q=relpos(e);p.x=q.x;p.y=q.y;});
  loop(function(){
   x.clearRect(0,0,420,300);
   for(var i=0;i<hz.length;i++){var h=hz[i];
    h.x+=h.vx;h.y+=h.vy;
    if(h.x<h.r||h.x>420-h.r)h.vx*=-1;
    if(h.y<h.r||h.y>300-h.r)h.vy*=-1;
    x.fillStyle=CORAL;x.beginPath();x.roundRect(h.x-h.r,h.y-h.r,h.r*2,h.r*2,5);x.fill();
    if(Math.hypot(h.x-p.x,h.y-p.y)<h.r+10){done(false);return;}}
   x.fillStyle=TEAL;x.beginPath();x.arc(p.x,p.y,11,0,6.3);x.fill();
   x.fillStyle='rgba(136,135,128,0.6)';x.font='400 13px sans-serif';
   x.fillText('move the teal dot',14,22);
  });
 }},
{name:'catch',prompt:'Catch it before it lands',timeoutWin:false,
 go:function(hard,done){
  var c=cvs(),x=c.getContext('2d');
  var o={x:60+Math.random()*300,y:-14,v:2.2+hard*3.4,r:16-hard*4};
  on(ST,'pointerdown',function(e){e.preventDefault();var q=relpos(e);
   done(Math.hypot(q.x-o.x,q.y-o.y)<o.r+14);});
  loop(function(){
   o.y+=o.v;
   x.clearRect(0,0,420,300);
   x.strokeStyle='rgba(136,135,128,0.4)';x.lineWidth=2;
   x.beginPath();x.moveTo(0,286);x.lineTo(420,286);x.stroke();
   x.fillStyle=AMBER;x.beginPath();x.arc(o.x,o.y,o.r,0,6.3);x.fill();
   if(o.y>286+o.r)done(false);
  });
 }},
{name:'count',prompt:'How many shapes?',timeoutWin:false,
 go:function(hard,done){
  var n=3+((Math.random()*(hard>0.5?7:5))|0);
  var c=cvs(),x=c.getContext('2d'),pts=[];
  for(var i=0;i<n;i++){
   var tries=0,p;
   do{p={x:34+Math.random()*352,y:30+Math.random()*180};tries++;}
   while(tries<40&&pts.some(function(q){return Math.hypot(q.x-p.x,q.y-p.y)<44;}));
   pts.push(p);}
  x.fillStyle=PURPLE;
  pts.forEach(function(p){x.beginPath();x.arc(p.x,p.y,15,0,6.3);x.fill();});
  var opts=[n];
  while(opts.length<4){var v=Math.max(1,n+((Math.random()*5)|0)-2);if(opts.indexOf(v)<0)opts.push(v);}
  opts.sort(function(a,b){return a-b;});
  var row=document.createElement('div');
  row.style.cssText='position:absolute;bottom:16px;left:0;right:0;display:flex;gap:8px;justify-content:center';
  opts.forEach(function(v){
   var b=document.createElement('button');b.textContent=v;b.dataset.v=v;
   b.style.cssText='width:52px;height:40px;font-size:17px;border-radius:8px;border:1px solid var(--border-strong);background:transparent;color:var(--text-primary);cursor:pointer';
   row.appendChild(b);});
  ST.appendChild(row);
  on(row,'pointerdown',function(e){var b=e.target.closest('button');if(b)done(+b.dataset.v===n);});
 }},
{name:'mash',prompt:'Fill the bar',timeoutWin:false,
 go:function(hard,done){
  var need=8+Math.round(hard*12),got=0;
  txt('tap anywhere fast',15,'var(--text-secondary)','24%');
  var lab=txt('0 / '+need,34,TEAL,'46%');
  var shell=document.createElement('div');
  shell.style.cssText='position:absolute;left:40px;right:40px;top:66%;height:16px;border-radius:8px;background:rgba(136,135,128,0.25);overflow:hidden';
  var fill=document.createElement('div');
  fill.style.cssText='height:100%;width:0%;background:'+AMBER;
  shell.appendChild(fill);ST.appendChild(shell);
  on(ST,'pointerdown',function(e){
   e.preventDefault();got++;
   lab.textContent=got+' / '+need;fill.style.width=Math.min(100,(got/need)*100)+'%';
   if(got>=need)done(true);});
 }},
{name:'wait',prompt:'Touch nothing',timeoutWin:true,
 go:function(hard,done){
  txt('hands off',44,CORAL,'42%');
  txt('do not tap, do not press a key',14,'var(--text-secondary)','64%');
  on(ST,'pointerdown',function(e){e.preventDefault();done(false);});
  on(window,'keydown',function(e){e.preventDefault();done(false);});
 }},
{name:'timing',prompt:'Tap inside the band',timeoutWin:false,
 go:function(hard,done){
  var c=cvs(),x=c.getContext('2d');
  var r=6,grow=1.4+hard*1.5,lo=78-hard*22,hi=lo+26-hard*10,fired=false;
  on(ST,'pointerdown',function(e){e.preventDefault();if(fired)return;fired=true;done(r>=lo&&r<=hi);});
  loop(function(){
   r+=grow;
   x.clearRect(0,0,420,300);
   x.strokeStyle=TEAL;x.lineWidth=hi-lo;x.globalAlpha=0.3;
   x.beginPath();x.arc(210,150,(lo+hi)/2,0,6.3);x.stroke();x.globalAlpha=1;
   x.strokeStyle=r>=lo&&r<=hi?TEAL:PURPLE;x.lineWidth=4;
   x.beginPath();x.arc(210,150,r,0,6.3);x.stroke();
   if(r>135)done(false);
  });
 }}];

var last=-1;
function round(){
  clear();
  var i;do{i=(Math.random()*MICRO.length)|0;}while(i===last&&MICRO.length>1);
  last=i;
  var m=MICRO[i],hard=Math.min(1,score/16);
  limit=Math.max(2100,4200-score*130);
  QV.textContent=(limit/1000).toFixed(1)+'s';
  BAR.style.width='100%';BAR.style.background=GRAY;
  txt(m.prompt,26,'var(--text-primary)','46%');
  txt('round '+(score+1),14,'var(--text-secondary)','62%');
  wait(function(){
   clear();
   var settled=false,t0=performance.now();
   function done(ok){if(settled)return;settled=true;clear();result(ok);}
   m.go(hard,done);
   BAR.style.background=TEAL;
   (function bar(){
    var p=1-(performance.now()-t0)/limit;
    BAR.style.width=Math.max(0,p*100)+'%';
    BAR.style.background=p<0.3?CORAL:p<0.6?AMBER:TEAL;
    if(p>0&&!settled)requestAnimationFrame(bar);
   })();
   wait(function(){done(!!m.timeoutWin);},limit);
  },900);
}

function result(ok){
  BAR.style.width='0%';
  if(ok){
   score++;QZ.textContent=score;QR.textContent=rank(score);
   if(score>best)best=score;
   txt('cleared',34,TEAL,'44%');
   if(score%5===0)txt('rank up — '+rank(score),16,AMBER,'62%');
  }else{
   lives--;QL.textContent='♥♥♥'.slice(0,Math.max(0,lives))||'—';
   txt('missed',34,CORAL,'44%');
   txt(lives>0?(lives===1?'one life left':lives+' lives left'):'',15,'var(--text-secondary)','62%');
  }
  wait(function(){if(lives<=0)over();else round();},820);
}

function over(){
  clear();
  txt('Quickfire',28,'var(--text-primary)','26%');
  txt(score+' cleared — '+rank(score),18,TEAL,'44%');
  txt(best>score?'your best run is '+best:'that is your best run so far',14,'var(--text-secondary)','58%');
  btn('Run it again','76%',start);
}

function start(){
  clear();score=0;lives=3;
  QZ.textContent='0';QL.textContent='♥♥♥';QR.textContent='Rookie';
  round();
}

txt('Quickfire',32,'var(--text-primary)','30%');
txt('Eight micro-games in random order. One instruction, one shot, three lives.',14,'var(--text-secondary)','48%');
btn('Start the run','72%',start);
})();
</script>
